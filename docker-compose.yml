services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: auth_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      OTP_PEPPER: ${OTP_PEPPER:-change-this-otp-pepper}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-10008663}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
    ports:
      - "50051:50051"

  sms-worker:
    build: .
    command: ["python", "manage.py", "sms-worker"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      SMS_QUEUE: sms.otp
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-10008663}

volumes:
  mongo-data:
